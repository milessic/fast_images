<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">

<title>Pictures</title>
{{STYLES_HEAD}}
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="topbar">
	<a class="brand" href="/">Fast Pictures</a>
	<div class="topbar-end">{{HOME_BUTTON}}</div>
</header>
<main class="container" id="app">
	<div class="page-head">
		<h3 id="pathheader"></h3>
	</div>
	<section class="card">
		<div class="toolbox">
			<button class="btn fitem" id="play" title="Slideshow">▶</button>
			<button class="btn fitem" id="shuffle" title="Shuffled slideshow">🔀</button>
		</div>
		<div id="grid"></div>
		<div class="toolbox">
			<button class="btn fitem" id="play" title="Slideshow">▶</button>
			<button class="btn fitem" id="shuffle" title="Shuffled slideshow">🔀</button>
			<label>Slideshow speed (s)
				<input class="fitem" id="slideshowspeed" type="number" min="1" value="5">
			</label>
		</div>
	</section>
	<details class="card" id="theme-settings" hidden>
		<summary>Style</summary>
		<div id="theme-picker"></div>
	</details>
	<footer class="card small muted">
		<span>Created by</span> <a href="https://mjportfolio.bieda.it/" target="_blank">Miłosz 'milessic' Jura</a><span id="year">, 2024</span>
	</footer>
</main>
<script src="/static/app.js"></script>
</body>
</html>
